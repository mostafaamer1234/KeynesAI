name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn pytest
      - name: Every Python file compiles
        run: python -m compileall -q *.py static/*.py evaluation
      - name: Leakage and metric tests
        run: pytest -q evaluation
